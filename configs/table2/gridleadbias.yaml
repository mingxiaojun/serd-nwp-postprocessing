experiment:
  id: gridleadbias
  table2_name: GridLeadBias
  purpose: Grid- and lead-dependent climatological bias correction with residual Gaussian uncertainty.
data:
  data_root_glob: ./example_data/CMA_gfs_time_order_3_72/*[0-9]
  data_dir: ./data
  train_dates: [2020-01-01, 2023-09-30]
  valid_dates: [2023-10-01, 2023-12-31]
  test_dates: [2024-01-01, 2024-12-31]
model:
  ensemble_size: 16
outputs:
  checkpoint_dir: ./outputs/checkpoints/gridleadbias
  metric_files:
    valid: allvars_gridlead_bias_valid_metrics.npz
    test: allvars_gridlead_bias_test_metrics.npz
scripts:
  train_and_evaluate: scripts/train_gridleadbias.py
  infer: scripts/infer_gridleadbias.py
  evaluate: scripts/evaluate_ensemble.py
