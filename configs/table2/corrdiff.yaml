experiment:
  id: corrdiff
  table2_name: CorrDiff
  purpose: CorrDiff-style target/residual generative baseline without fCRPS.
data:
  data_root_glob: ./example_data/CMA_gfs_time_order_3_72/*[0-9]
  data_dir: ./data
  topo_path: ./data/topo_data_Normalization.npy
  train_dates: [2020-01-01, 2023-09-30]
  valid_dates: [2023-10-01, 2023-12-31]
  test_dates: [2024-01-01, 2024-12-31]
model:
  stage1: deterministic analysis-target U-Net
  stage2: score-only conditional VE-SDE diffusion
  ensemble_size: 16
  lambda_fcrps: 0.0
  learning_rate: 0.0002
  sigma_min: 0.001
  sigma_max: 10.0
  scheduler: {name: ReduceLROnPlateau, mode: min, factor: 0.5, patience: 5, min_lr: 0.000001}
outputs:
  checkpoint_dir: ./outputs/checkpoints/corrdiff
  prediction_root: ./outputs/predictions/corrdiff
  stage1_best_checkpoint: reg_sysbias_best_corrdiff_stage1.pth
  diffusion_best_checkpoint: corrdiff_score_only_best_full.pth
  residual_scaler: ./data/scalers_corrdiff_residual_zscore_train.pkl
scripts:
  train_stage1: scripts/train_corrdiff_stage1.py
  infer_stage1: scripts/infer_stage1_mean.py --target analysis
  build_residuals: scripts/build_corrdiff_residuals.py
  train_diffusion: scripts/train_corrdiff_diffusion.py
  infer_diffusion: scripts/infer_stage2_serd.py
  evaluate: scripts/evaluate_ensemble.py
